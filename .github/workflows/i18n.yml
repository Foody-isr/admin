name: i18n

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'scripts/check-i18n.cjs'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check translation completeness
        run: npm run check:i18n
