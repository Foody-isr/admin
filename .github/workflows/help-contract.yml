name: Help documentation contract
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: help-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  help:
    name: Help coverage and translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/help-contract.test.mjs scripts/help-ui.test.mjs
      - name: Resolve immutable documentation reference
        id: docs
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("docs/help/contract.json")); if(!/^[a-f0-9]{40}$/.test(c.documentationRef)) throw new Error("Pin the reviewed Landing commit"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "ref="+c.documentationRef+"\n");'
      - uses: actions/checkout@v4
        with:
          repository: Foody-isr/landing
          ref: ${{ steps.docs.outputs.ref }}
          path: .help-docs
          persist-credentials: false
          sparse-checkout: |
            docs/help
            src/content/help
      - name: Check guides against current Admin screens
        run: node scripts/check-help-ui.mjs --documentation-root .help-docs --admin-root .
      - name: Check source impact and three-language procedures
        env:
          HELP_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-help-contract.mjs --documentation-root .help-docs ${HELP_BASE:+--base "$HELP_BASE"}
